# Snapshots of the Samba dataset, shown in Windows as "Previous Versions".
# Hourly snapshots only in working hours: sanoid.timer runs 07-19 on weekdays and once
# a day at 07:00 on weekends (sanoid.timer.d/syno-hours.conf); pruning runs every time.
[data/samba]
	use_template = samba

[template_samba]
	frequently = 0
	hourly = 24
	daily = 30
	weekly = 8
	monthly = 6
	yearly = 0
	autosnap = yes
	autoprune = yes

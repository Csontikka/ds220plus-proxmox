# Hardware watchdog (wdat_wdt): if the system hangs, the box resets itself. The boot
# guard then keeps the next boot in ZFSBootMenu (SSH) unless the boot comes up healthy.
# Measured on a DS220+: the WDAT resets about 25 s later than the set timeout.
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=5min

syno_serial --pci=0,24,2 --speed=115200 --uppci=0,24,0 --upspeed=115200
terminal_input serial
terminal_output serial
set default='1'
set timeout='3'
set fallback='0'

# One-shot Debian boot: only when /linux-once exists (it is only ever created on
# DOM partition 2). The Debian initramfs deletes it first thing (init-top), so the next
# boot is DSM. If the Debian entry fails inside GRUB, fall back to the normal DSM (1).
# (This GRUB has no test, source, configfile or save_env; ls fails on files.)
if search --no-floppy --file --set=synoflag /linux-once; then
	set default='2'
	set fallback='1'
fi

menuentry "SYNOLOGY_1" {
	search --fs-uuid --no-floppy --set=root 10EE-589C
	devicetree /model.dtb
	linux /zImage root=/dev/md0 intel_iommu=igfx_off netif_num=2 HddEnableDynamicPower=1 syno_hw_version=DS220+ vender_format_version=2 synoboot1
	initrd /rd.gz
}
menuentry "SYNOLOGY_2" {
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	cksum /grub_cksum.syno
	vender /vender -s
	devicetree /model.dtb
	linux /zImage root=/dev/md0 intel_iommu=igfx_off netif_num=2 HddEnableDynamicPower=1 syno_hw_version=DS220+ vender_format_version=2 synoboot2
	initrd /rd.gz
}
menuentry "DEBIAN_USB" {
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	vender /vender -s
	linux /synodeb/vmlinuz root=LABEL=SYNODEB rootwait ro panic=30 oops=panic softlockup_panic=1 loglevel=7 printk.devkmsg=on console=tty0 console=ttyS1,115200n8
	initrd /synodeb/initrd.img
}

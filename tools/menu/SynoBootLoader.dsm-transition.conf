syno_serial --pci=0,24,2 --speed=115200 --uppci=0,24,0 --upspeed=115200
terminal_input serial
terminal_output serial
set timeout='3'

# TRANSITIONAL menu for installing Proxmox from a running DSM without a serial console
# (docs/install-from-dsm.md, phases 1-2). The DSM stays the default; ZFSBootMenu runs only
# once, when the "zbm-menu" flag file sits in the root of DOM p2. The ZBM early hook
# deletes the flag, so a power cycle always brings the DSM back. No "ok" markers are
# used here. Replace this file with SynoBootLoader.conf after the install (phase 4).
# Entries (same order as the final menu):
#   0 SYNOLOGY_1  factory recovery kernel (DOM p1), never touched
#   1 SYNOLOGY_2  DSM kernel (DOM p2): the default in this phase
#   2 ZBM, 3 ZBM_B       not used by this menu's logic (kept for the same numbering)
#   4 ZBM_MENU    ZFSBootMenu A that waits in its menu (SSH): the one-shot target
#   5 ZBM_B_MENU  the same with B
# ZBM_MENU here adds panic=30 (a panic after the flag is gone reboots into the DSM) and
# syno.wd (the ZBM hook arms the WDAT watchdog; disarm it with /usr/local/sbin/syno-wd-stop right after logging in).
# This GRUB has no test/source/save_env and ls fails on files: search --file only.

set default='1'
set fallback='0'
# one-shot: ZBM waits in its menu; the ZBM hook removes the flag
if search --no-floppy --file --set=synoflag /zbm-menu; then
	set default='4'
	set fallback='1 0'
fi

menuentry "SYNOLOGY_1" {
	search --fs-uuid --no-floppy --set=root 10EE-589C
	devicetree /model.dtb
	linux /zImage root=/dev/md0 intel_iommu=igfx_off netif_num=2 HddEnableDynamicPower=1 syno_hw_version=DS220+ vender_format_version=2 synoboot1
	initrd /rd.gz
}
menuentry "SYNOLOGY_2" {
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	cksum /grub_cksum.syno
	vender /vender -s
	devicetree /model.dtb
	linux /zImage root=/dev/md0 intel_iommu=igfx_off netif_num=2 HddEnableDynamicPower=1 syno_hw_version=DS220+ vender_format_version=2 synoboot2
	initrd /rd.gz
}
menuentry "ZBM" {
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	vender /vender -s
	linux /zbm/vmlinuz-bootmenu ro loglevel=4 console=tty0 console=ttyS5,115200n8 zbm.lines=25 zbm.columns=80 efi=noruntime zbm.timeout=10
	initrd /zbm/initramfs-bootmenu.img
}
menuentry "ZBM_B" {
	search --fs-uuid --no-floppy --set=zbmbk 10EE-589C
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	vender /vender -s
	linux ($zbmbk)/zbmb/vmlinuz-bootmenu ro loglevel=4 console=tty0 console=ttyS5,115200n8 zbm.lines=25 zbm.columns=80 efi=noruntime zbm.timeout=10
	initrd /zbmb/initramfs-bootmenu.img
}
menuentry "ZBM_MENU" {
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	vender /vender -s
	linux /zbm/vmlinuz-bootmenu ro loglevel=4 console=tty0 console=ttyS5,115200n8 zbm.lines=25 zbm.columns=80 efi=noruntime zbm.show panic=30 syno.wd
	initrd /zbm/initramfs-bootmenu.img
}
menuentry "ZBM_B_MENU" {
	search --fs-uuid --no-floppy --set=zbmbk 10EE-589C
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	vender /vender -s
	linux ($zbmbk)/zbmb/vmlinuz-bootmenu ro loglevel=4 console=tty0 console=ttyS5,115200n8 zbm.lines=25 zbm.columns=80 efi=noruntime zbm.show panic=30 syno.wd
	initrd /zbmb/initramfs-bootmenu.img
}

syno_serial --pci=0,24,2 --speed=115200 --uppci=0,24,0 --upspeed=115200
terminal_input serial
terminal_output serial
set timeout='3'

# Menu of the DS220+, A/B ZFSBootMenu. Entries:
#   0 SYNOLOGY_1  factory recovery kernel (DOM p1), never touched
#   1 SYNOLOGY_2  DSM kernel (DOM p2), kept as it came
#   2 ZBM         ZFSBootMenu A (DOM p2 /zbm), boots Proxmox from the ZFS mirror
#   3 ZBM_B       ZFSBootMenu B, the previous known-good copy
#                 (kernel on DOM p1 /zbmb, initramfs on DOM p2 /zbmb: p2 is too small for both)
#   4 ZBM_MENU    ZFSBootMenu A that waits in its menu (SSH rescue)
#   5 ZBM_B_MENU  the same with B
# A and B are never written at the same time. A slot is the default only while its
# ok marker exists (written last, after the checksums matched), so a half-written
# slot is skipped. If loading a slot fails, GRUB falls back to the next one and in
# the end to the factory recovery.
# This GRUB has no test/source/save_env and ls fails on files: search --file only.
# efi=noruntime for ZBM: the firmware runs Secure Boot, and with EFI runtime the
# kernel IMA policy refuses to kexec the Proxmox-signed kernel (key not trusted).

if search --no-floppy --file --set=synook /zbm/ok; then
	set default='2'
	set fallback='3 0'
else
	if search --no-floppy --file --set=synook /zbmb/ok; then
		set default='3'
		set fallback='0'
	else
		set default='0'
	fi
fi
# one-shot: ZBM waits in its menu; the ZBM hook removes the flag
if search --no-floppy --file --set=synoflag /zbm-menu; then
	set default='4'
	set fallback='5 0'
fi

menuentry "SYNOLOGY_1" {
	search --fs-uuid --no-floppy --set=root 10EE-589C
	devicetree /model.dtb
	linux /zImage root=/dev/md0 intel_iommu=igfx_off netif_num=2 HddEnableDynamicPower=1 syno_hw_version=DS220+ vender_format_version=2 synoboot1
	initrd /rd.gz
}
menuentry "SYNOLOGY_2" {
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	cksum /grub_cksum.syno
	vender /vender -s
	devicetree /model.dtb
	linux /zImage root=/dev/md0 intel_iommu=igfx_off netif_num=2 HddEnableDynamicPower=1 syno_hw_version=DS220+ vender_format_version=2 synoboot2
	initrd /rd.gz
}
menuentry "ZBM" {
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	vender /vender -s
	linux /zbm/vmlinuz-bootmenu ro loglevel=4 console=tty0 console=ttyS5,115200n8 zbm.lines=25 zbm.columns=80 efi=noruntime zbm.timeout=10
	initrd /zbm/initramfs-bootmenu.img
}
menuentry "ZBM_B" {
	search --fs-uuid --no-floppy --set=zbmbk 10EE-589C
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	vender /vender -s
	linux ($zbmbk)/zbmb/vmlinuz-bootmenu ro loglevel=4 console=tty0 console=ttyS5,115200n8 zbm.lines=25 zbm.columns=80 efi=noruntime zbm.timeout=10
	initrd /zbmb/initramfs-bootmenu.img
}
menuentry "ZBM_MENU" {
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	vender /vender -s
	linux /zbm/vmlinuz-bootmenu ro loglevel=4 console=tty0 console=ttyS5,115200n8 zbm.lines=25 zbm.columns=80 efi=noruntime zbm.show
	initrd /zbm/initramfs-bootmenu.img
}
menuentry "ZBM_B_MENU" {
	search --fs-uuid --no-floppy --set=zbmbk 10EE-589C
	search --fs-uuid --no-floppy --set=root 45E5B07D-4783-4867-A369-F99C0CD1E610
	vender /vender -s
	linux ($zbmbk)/zbmb/vmlinuz-bootmenu ro loglevel=4 console=tty0 console=ttyS5,115200n8 zbm.lines=25 zbm.columns=80 efi=noruntime zbm.show
	initrd /zbmb/initramfs-bootmenu.img
}

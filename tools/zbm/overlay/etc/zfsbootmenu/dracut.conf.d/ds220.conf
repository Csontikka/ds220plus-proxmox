# ZFSBootMenu for the Synology DS220+: only this box's drivers, to fit on the 120 MB DOM.
hostonly="no"
compress="zstd"
drivers=" wdat_wdt pinctrl_geminilake pinctrl_intel zfs spl xhci_pci xhci_hcd usb_storage uas sd_mod scsi_mod ahci libahci r8169 realtek bonding ext4 vfat nls_cp437 nls_iso8859_1 8250_dw intel_lpss_pci intel_lpss idma64 "
install_items+=" /usr/sbin/sgdisk /usr/bin/zstd /usr/bin/tar /usr/sbin/smartctl /usr/sbin/wipefs /usr/sbin/e2fsck /usr/bin/gpioset /usr/bin/gpiodetect /usr/bin/gpioget /usr/sbin/dropbear /usr/bin/busybox /usr/sbin/ip /etc/zfsbootmenu/udhcpc.script /etc/zfsbootmenu/syno-zbm-name /root/.ssh/authorized_keys /etc/dropbear/dropbear_ed25519_host_key /usr/lib/firmware/rtl_nic/rtl8168h-2.fw /usr/local/sbin/syno-bootguard /usr/local/sbin/syno-microp "
zfsbootmenu_hook_root="/etc/zfsbootmenu/hooks"
